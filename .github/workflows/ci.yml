# Formatting, lints and the whole test suite on macOS, the main platform,
# for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # A fixed Rust, so that a new release's lints never fail a push that
      # changed nothing; raise it by hand and fix what the new clippy finds.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      # Measures delay and lag against the wall clock, so it runs on its own:
      # beside the rest of the suite a busy machine looks like a slow network.
      - name: The lossy-network test, alone
        run: >-
          cargo test --release -p bw_desktop --bin brinewake --
          --ignored --exact net::tests::a_bad_connection_keeps_the_match_in_step_and_close_to_real_time
