# The Windows release binaries, the launcher (BRINEWAKE.exe) and the game
# (brinewake.exe), built from a tag by CI, ready for code signing later:
# signing services for open source projects, such as SignPath Foundation,
# sign only binaries built by CI from the public repository. Until then
# tools/release.sh cross-builds the Windows download on the maintainer's
# machine and signs the update manifest there; the ed25519 release key never
# enters CI.
name: Windows release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW and the Windows target
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64-win32
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build the launcher and the game
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          cargo build --release --target x86_64-pc-windows-gnu \
            -p bw_desktop --bin brinewake -p bw_launcher --bin brinewake-launcher
          mkdir -p windows-unsigned
          cp target/x86_64-pc-windows-gnu/release/brinewake-launcher.exe windows-unsigned/BRINEWAKE.exe
          cp target/x86_64-pc-windows-gnu/release/brinewake.exe windows-unsigned/brinewake.exe
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: windows-unsigned
          path: windows-unsigned/
      # Not signed yet. If SignPath Foundation (free for open source projects
      # with an established following) accepts the project later, sign the
      # artifact here:
