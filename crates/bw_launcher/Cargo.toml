[package]
name = "bw_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The launcher players start: it checks danprice.ai/brinewake for a newer
# game, installs it, and starts the game.
[[bin]]
name = "brinewake-launcher"
path = "src/main.rs"

# Release tooling: signing key, packing, manifest and signature.
[[bin]]
name = "brinewake-release"
path = "src/bin/release.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
winit.workspace = true
softbuffer = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
