[package]
name = "bw_desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "brinewake"
path = "src/main.rs"

[dependencies]
bw_core = { path = "../bw_core" }
bw_content = { path = "../bw_content" }
bw_sim = { path = "../bw_sim" }
serde.workspace = true
serde_json.workspace = true
image.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
cpal = "0.18"
# Join codes: ask the home router to forward the host's port (UPnP).
igd-next = { version = "0.17", default-features = false }
# Copy and paste join codes.
arboard = { version = "3.6", default-features = false }

[target.'cfg(windows)'.dependencies]
# A message box when the game cannot start (release builds have no console).
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
